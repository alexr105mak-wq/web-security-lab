<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учебные заметки{% endblock %}</title>
    <style>
        body { max-width: 760px; margin: 32px auto; padding: 0 20px; font-family: sans-serif; line-height: 1.6; }
        nav { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 28px; }
        nav form { margin: 0; }
        label { display: block; margin-top: 12px; }
        input, button { font: inherit; padding: 6px 10px; }
        button { cursor: pointer; }
        .error { color: #a51c30; }
        .note-content { white-space: pre-wrap; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <nav aria-label="Главная навигация">
        <a href="{{ url_for('index') }}">Главная</a>
        {% if g.user %}
            <a href="{{ url_for('notes') }}">Мои заметки</a>
            <span>Пользователь: <strong>{{ g.user['username'] }}</strong></span>
            <form action="{{ url_for('logout') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}">Войти</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
